apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app-of-apps
  namespace: argocd
spec:
  destination:
    namespace: argocd
    server: https://kubernetes.default.svc
  project: default
  source:
    directory:
      recurse: true
    path: argo-cd-apps/
    repoURL: https://github.com/abourn/argo-cd-demo.git
    targetRevision: HEAD
