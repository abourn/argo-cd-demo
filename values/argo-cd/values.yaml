global:
  addPrometheusAnnotations: true
  domain: argocd.local

configs:
  params:
    server.insecure: true
  
  cm:
    url: http://argocd.local
    # OIDC configuration for Keycloak
    oidc.config: |
      name: Keycloak
      issuer: http://keycloak.local/auth/realms/argocd
      clientID: argocd
      clientSecret: $oidc.keycloak.clientSecret
      requestedScopes: ["openid", "profile", "email", "groups"]
      refreshTokenThreshold: 2m

  # Store the Keycloak client secret
  secret:
    extra:
      oidc.keycloak.clientSecret: "CHANGE_ME_TO_SECURE_SECRET"

  # RBAC configuration - map groups to ArgoCD roles
  rbac:
    policy.csv: |
      g, argocd-admin, role:admin
      g, argocd-dev, role:readonly
      
    policy.default: role:readonly

controller:
  metrics:
    enabled: true

repoServer:
  metrics:
    enabled: true

server:
  ingress:
    enabled: true    
    ingressClassName: contour
    annotations:
      argocd.argoproj.io/ignore-healthcheck: "true"
  metrics:
    enabled: true

dex:
  metrics:
    enabled: true

redis:
  metrics:
    enabled: true

applicationSet:
  metrics:
    enabled: true

notifications:
  metrics:
    enabled: true
  argocdUrl: http://argocd.local
