command:
  - "/opt/keycloak/bin/kc.sh"
  - "start"
  - "--http-port=8080"
  - "--import-realm"

ingress:
  enabled: true
  ingressClassName: "contour"
  annotations:
    argocd.argoproj.io/ignore-healthcheck: "true"
  rules:
  -
    host: "keycloak.local"
    paths:
      - path: '{{ tpl .Values.http.relativePath $ | trimSuffix "/" }}/'
        pathType: Prefix

extraEnv: |
  - name: KC_HOSTNAME
    value: keycloak.local
  - name: KC_HOSTNAME_STRICT
    value: "true"
  - name: KEYCLOAK_ADMIN
    value: admin
  - name: KEYCLOAK_ADMIN_PASSWORD
    value: admin
  - name: JAVA_OPTS_APPEND
    value: >-
      -Djgroups.dns.query={{ include "keycloak.fullname" . }}-headless

extraVolumes: |
  - name: realm-config
    configMap:
      name: keycloak-realm

extraVolumeMounts: |
  - name: realm-config
    mountPath: /opt/keycloak/data/import
    readOnly: true

extraManifests: 
  - |
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: keycloak-realm
      data:
        realm.json: |
          {
            "realm": "argocd",
            "id": "argocd",
            "enabled": true,
            "accessTokenLifespan": 900,
            "refreshTokenMaxReuse": 0,
            "revokeRefreshToken": false,            
            "defaultRoles": ["offline_access", "uma_authorization"],
            "roles": {
              "realm": [
                {
                  "name": "admin",
                  "description": "Admin role for ArgoCD"
                },
                {
                  "name": "developer",
                  "description": "Developer role for ArgoCD"
                }
              ]
            },
            "groups": [
              {
                "name": "argocd-admin",
                "realmRoles": ["admin"]
              },
              {
                "name": "argocd-dev",
                "realmRoles": ["developer"]
              }
            ],
            "users": [
              {
                "username": "admin-user",
                "email": "admin@example.com",
                "firstName": "Admin",
                "lastName": "User",
                "enabled": true,
                "credentials": [
                  {
                    "type": "password",
                    "value": "password123"
                  }
                ],
                "groups": ["argocd-admin"]
              },
              {
                "username": "demo-user",
                "email": "demo@example.com",
                "firstName": "Demo",
                "lastName": "User",
                "enabled": true,
                "credentials": [
                  {
                    "type": "password",
                    "value": "password123"
                  }
                ],
                "groups": ["argocd-dev"]
              }
            ],
            "clients": [
              {
                "clientId": "argocd",
                "name": "ArgoCD",
                "enabled": true,
                "clientAuthenticatorType": "client-secret",
                "secret": "CHANGE_ME_TO_SECURE_SECRET",
                "redirectUris": [
                  "http://argocd.local/auth/callback"
                ],
                "webOrigins": [
                  "http://argocd.local"
                ],
                "publicClient": false,
                "standardFlowEnabled": true,
                "implicitFlowEnabled": false,
                "directAccessGrantsEnabled": false,
                "protocol": "openid-connect",
                "defaultClientScopes": [
                  "openid",
                  "email",
                  "profile",
                  "roles",
                  "groups"
                ],
                "optionalClientScopes": [
                  "address",
                  "phone"
                ]
              }
            ],
            "clientScopes": [
              {
                "name": "groups",
                "protocol": "openid-connect",
                "protocolMappers": [
                  {
                    "name": "groups",
                    "protocol": "openid-connect",
                    "protocolMapper": "oidc-group-membership-mapper",
                    "consentRequired": false,
                    "config": {
                      "claim.name": "groups",
                      "full.path": "false",
                      "id.token.claim": "true",
                      "access.token.claim": "true",
                      "userinfo.token.claim": "true"
                    }
                  }
                ]
              },
              {
                "name": "openid",
                "protocol": "openid-connect",
                "protocolMappers": []
              },
              {
                "name": "profile",
                "protocol": "openid-connect",
                "protocolMappers": [
                  {
                    "name": "username",
                    "protocol": "openid-connect",
                    "protocolMapper": "oidc-usermodel-property-mapper",
                    "config": {
                      "userinfo.token.claim": "true",
                      "user.attribute": "username",
                      "id.token.claim": "true",
                      "access.token.claim": "true",
                      "claim.name": "preferred_username"
                    }
                  }
                ]
              },
              {
                "name": "email",
                "protocol": "openid-connect",
                "protocolMappers": [
                  {
                    "name": "email",
                    "protocol": "openid-connect",
                    "protocolMapper": "oidc-usermodel-property-mapper",
                    "config": {
                      "userinfo.token.claim": "true",
                      "user.attribute": "email",
                      "id.token.claim": "true",
                      "access.token.claim": "true",
                      "claim.name": "email"
                    }
                  }
                ]
              },
              {
                "name": "roles",
                "protocol": "openid-connect",
                "protocolMappers": [
                  {
                    "name": "realm roles",
                    "protocol": "openid-connect",
                    "protocolMapper": "oidc-usermodel-realm-role-mapper",
                    "config": {
                      "userinfo.token.claim": "true",
                      "multivalued": "true",
                      "id.token.claim": "true",
                      "access.token.claim": "true",
                      "claim.name": "realm_access.roles"
                    }
                  }
                ]
              }
            ]
          }
