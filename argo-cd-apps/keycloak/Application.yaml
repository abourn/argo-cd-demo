apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keycloak
  namespace: argocd
spec:
  destination:
    namespace: argocd
    server: https://kubernetes.default.svc
  project: default
  source:
    path: manifests/keycloak
    repoURL: https://github.com/abourn/argo-cd-demo.git
    targetRevision: HEAD
  syncPolicy:
    automated:        
      enabled: true
    syncOptions:
      - CreateNamespace=true
